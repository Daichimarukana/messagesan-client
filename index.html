<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージカードさん</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div id="section-create" class="card-full">
        <h1>メッセージカードさん</h1>
        <p>開発: <a href="https://daichimarukana.com/">@daichimarukana</a></p>
        <h2>メッセージボックスの作成</h2>
        <p>URLを発行して<span class="recipient">メッセージを受け取る人</span>と<span class="sender">メッセージを送る人</span>に共有してください！<br>
            <br>
            メッセージはE2EEにより安全にやりとりされます！(サービス管理者でも覗くことはできません)
        </p>
        <button id="btn-create-box">メッセージボックスを作成</button>
        <div id="created-urls" style="display:none; margin-top: 15px;">
            <p><strong>メッセージを受け取る人用URL(閲覧専用)</strong></p>
            <div id="url-recipient" class="url-box"></div>
            <p style="margin-top: 10px;"><strong>メッセージを送る人用URL(書き込み可能)</strong></p>
            <div id="url-sender" class="url-box"></div>

            <p style="margin-top: 15px;">それぞれ共有し終わりましたか？<br>
                そしたらあなたも...</p>
            <button id="go-send">メッセージを送る！</button>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;"></div>

    <div id="section-form" class="half-modal" style="display:none;">
        <div id="half-modal-header" class="half-modal-header">
            <div class="modal-header-title">メッセージを送る</div>
        </div>

        <div class="half-modal-content">
            <p>下のカードのテキスト部分を直接クリックしてメッセージを入力できます。</p>

            <div id="editor-card" class="square-card interactive-card">
                <div class="card-content">
                    <div class="card-header">
                        <label class="icon-wrapper" title="クリックしてアイコン画像を選択">
                            <img id="editor-icon-img" class="sender-icon" alt="icon" src="assets/defaulticon.png">
                            <div class="icon-overlay">変更</div>
                            <input type="file" id="send-icon-file" accept="image/*" style="display:none;">
                        </label>

                        <div style="flex-grow: 1;">
                            <div id="editor-name" class="editable-field" contenteditable="true"
                                placeholder="名前をここに入力..." style="font-weight: bold; font-size: 1.05rem; outline: none;"></div>
                        </div>
                    </div>

                    <div id="editor-body" class="card-body editable-field" contenteditable="true"
                        placeholder="メッセージをここに入力..."></div>

                    <div style="font-size: 12px; opacity: 0.8; text-align: right;">
                        <span id="editor-date">今日</span>
                    </div>
                </div>
            </div>

            <label style="margin-top: 15px; display: block; font-weight: bold;">公開範囲</label>
            <div class="radio-group">
                <input type="radio" id="privacy-public" class="radiobtn_input" name="privacy" value="public" checked>
                <label for="privacy-public" class="radiobtn_label">みんなに見せる</label>

                <input type="radio" id="privacy-private" class="radiobtn_input" name="privacy" value="private">
                <label for="privacy-private" class="radiobtn_label">受け取る人のみ</label>
            </div>

            <label style="margin-top: 15px; display:block; font-weight: bold;">背景デザイン</label>
            <div id="template-selector" class="template-selector"></div>

            <button id="send-btn" style="margin-top: 20px;">メッセージを追加</button>
        </div>
    </div>

    <div id="section-box" class="card-full" style="display:none;">
        <h2 id="box-title">みんなのメッセージ</h2>
        <div id="cards-container" class="cards-grid"></div>
    </div>

    <script>
        const NODES = ['wss://msgsan.emptybox.win'];
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();

        const TEMPLATES = [
            { id: 'tpl-01', bgUrl: '/assets/template/tpl-1.png', color: '#fd8fa2' },
            { id: 'tpl-02', bgUrl: '/assets/template/tpl-2.png', color: '#ff8b3e' },
            { id: 'tpl-03', bgUrl: '/assets/template/tpl-3.png', color: '#84fab0' },
            { id: 'tpl-04', bgUrl: '/assets/template/tpl-4.png', color: '#66a3ff' },
            { id: 'tpl-05', bgUrl: '/assets/template/tpl-5.png', color: '#d8b4fe' },
            { id: 'tpl-06', bgUrl: '/assets/template/tpl-6.png', color: '#3e3327' }
        ];

        let selectedTemplate = TEMPLATES[0];
        let currentIconDataUrl = null;
        let globalWs = null;
        const renderedCardIds = new Set();

        function getParams() {
            const searchParams = new URLSearchParams(location.search);
            const hashString = location.hash.startsWith('#') ? location.hash.substring(1) : location.hash;
            const hashParams = new URLSearchParams(hashString);

            return {
                box: hashParams.get('box') || searchParams.get('box'),
                boxKey: hashParams.get('boxKey') || searchParams.get('boxKey'),
                priv: hashParams.get('priv') || searchParams.get('priv'),
                pub: hashParams.get('pub') || searchParams.get('pub')
            };
        }

        function bufToBase64(buf) {
            const bytes = new Uint8Array(buf);
            let binary = '';
            const chunkSize = 0x2000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function base64ToBuf(str) {
            const binaryStr = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
            const len = binaryStr.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isSafeImageUrl(url) {
            if (!url) return false;
            return /^(data:image\/(png|jpeg|webp|gif|svg\+xml);base64,|https?:\/\/|\/|assets\/)/i.test(url);
        }

        async function imageUrlToDataUrl(url, fallbackColor, maxSide = 800) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Fetch failed');
                const blob = await res.blob();

                return new Promise((resolve) => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(blob);
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h) {
                            if (w > maxSide) { h *= maxSide / w; w = maxSide; }
                        } else {
                            if (h > maxSide) { w *= maxSide / h; h = maxSide; }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(objectUrl);
                        resolve(canvas.toDataURL('image/webp', 0.75));
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(objectUrl);
                        resolve(createFallbackDataUrl(fallbackColor));
                    };
                    img.src = objectUrl;
                });
            } catch (e) {
                return createFallbackDataUrl(fallbackColor);
            }
        }

        function createFallbackDataUrl(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, 400, 400);
            return canvas.toDataURL('image/webp', 0.85);
        }

        function fileToDataUrl(file, maxSide = 150) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h) {
                            if (w > maxSide) { h *= maxSide / w; w = maxSide; }
                        } else {
                            if (h > maxSide) { w *= maxSide / h; h = maxSide; }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        $(function () {
            initTemplateSelector();
            $('#editor-date').text(new Date().toLocaleString());

            $('#send-icon-file').on('change', async function () {
                const file = this.files[0];
                if (!file) return;
                currentIconDataUrl = await fileToDataUrl(file);
                $('#editor-icon-img').attr('src', currentIconDataUrl).show();
            });

            $('#btn-create-box').on('click', createbox);
            $('#send-btn').on('click', sendCard);

            $(window).on('hashchange', parseHashAndSetup);

            parseHashAndSetup();
        });

        function initTemplateSelector() {
            const $selector = $('#template-selector').empty();

            TEMPLATES.forEach((tpl, index) => {
                const $item = $('<div>')
                    .addClass(`template-item ${index === 0 ? 'selected' : ''}`)
                    .css({ backgroundImage: `url(${tpl.bgUrl})` })
                    .on('click', function () {
                        $('.template-item').removeClass('selected'); $(this).addClass('selected');
                        selectedTemplate = tpl;
                        applyTemplateToEditor(tpl);
                    });

                $selector.append($item);
            });

            applyTemplateToEditor(TEMPLATES[0]);
        }

        function applyTemplateToEditor(tpl) {
            $('#editor-card').css({
                backgroundImage: `url(${tpl.bgUrl})`,
                color: tpl.color
            });
            $('#editor-card .editable-field, #editor-name, #editor-body, #editor-date').css({
                color: tpl.color
            });
        }

        async function createbox() {
            const boxId = crypto.randomUUID();
            const boxRawKey = crypto.getRandomValues(new Uint8Array(32));
            const boxKeyStr = bufToBase64(boxRawKey);

            const keyPair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);
            const privJwk = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
            const pubJwk = await crypto.subtle.exportKey("jwk", keyPair.publicKey);

            const privStr = bufToBase64(encoder.encode(JSON.stringify(privJwk)));
            const pubStr = bufToBase64(encoder.encode(JSON.stringify(pubJwk)));

            const baseUrl = location.origin + location.pathname;
            // boxIDを含め、すべてのパラメータをハッシュ(#)の中に格納
            const recipientUrl = `${baseUrl}#box=${boxId}&boxKey=${encodeURIComponent(boxKeyStr)}&priv=${encodeURIComponent(privStr)}`;
            const senderUrl = `${baseUrl}#box=${boxId}&boxKey=${encodeURIComponent(boxKeyStr)}&pub=${encodeURIComponent(pubStr)}`;

            $('#url-recipient').text(recipientUrl);
            $('#url-sender').text(senderUrl);
            $('#created-urls').slideDown(200);

            $('#go-send').off('click').on('click', () => goSend(senderUrl));
        }

        function goSend(url) {
            window.location = url;
        }

        function initWebSocketConnection() {
            const params = getParams();
            if (!params.box) return;

            globalWs = new WebSocket(NODES[0]);

            globalWs.onopen = () => {
                console.log('WebSocket接続成功');
                requestCards();
            };

            globalWs.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'ERROR') {
                    alert(data.message);
                    return;
                }

                if (data.type === 'CARDS_DATA') {
                    $('#cards-container').empty();
                    renderedCardIds.clear();

                    if (data.cards.length === 0) {
                        $('#cards-container').html('<p id="no-cards-msg" style="color:#888; grid-column: 1/-1;">まだカードがありません。</p>');
                        return;
                    }

                    for (const card of data.cards) {
                        await decryptAndRenderCard(card, 'append');
                    }
                }

                if (data.type === 'NEW_CARD') {
                    $('#no-cards-msg').remove();
                    await decryptAndRenderCard(data.card, 'prepend');
                }
            };

            globalWs.onclose = () => {
                console.warn('WebSocket接続が切断されました。3秒後に再接続を試みます...');
                setTimeout(initWebSocketConnection, 3000);
            };
        }

        function requestCards() {
            const params = getParams();

            if (globalWs && globalWs.readyState === WebSocket.OPEN && params.box) {
                globalWs.send(JSON.stringify({ type: 'FETCH_CARDS', box_id: params.box }));
            }
        }

        async function sendCard() {
            const plainText = $('#editor-body')[0].innerText.trim();
            if (!plainText) {
                alert("メッセージが入力されていません！");
                return;
            }

            const $btn = $('#send-btn');
            $btn.prop('disabled', true).text('メッセージを送信中...');

            try {
                const params = getParams();
                const boxId = params.box;
                const boxKeyStr = params.boxKey;

                if (!boxId || !boxKeyStr) {
                    alert('URLが無効です。');
                    return;
                }

                const isPrivate = $('input[name="privacy"]:checked').val() === 'private';
                const senderName = $('#editor-name').text().trim() || '匿名';
                const bgDataUrl = await imageUrlToDataUrl(selectedTemplate.bgUrl, selectedTemplate.color);

                const cardData = {
                    sender_name: senderName,
                    sender_icon: currentIconDataUrl,
                    text: plainText,
                    bg_image: bgDataUrl,
                    theme_color: selectedTemplate.color,
                    created_at: Date.now()
                };

                let payload = {};

                if (!isPrivate) {
                    const cryptoKey = await crypto.subtle.importKey("raw", base64ToBuf(boxKeyStr), { name: "AES-GCM" }, false, ["encrypt"]);
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const encryptedBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, encoder.encode(JSON.stringify(cardData)));

                    payload = { mode: 'public', iv: bufToBase64(iv), ciphertext: bufToBase64(encryptedBuf) };
                } else {
                    let recipPubJwk;
                    if (params.pub) {
                        recipPubJwk = JSON.parse(decoder.decode(base64ToBuf(params.pub)));
                    } else if (params.priv) {
                        const privJwk = JSON.parse(decoder.decode(base64ToBuf(params.priv)));
                        recipPubJwk = { kty: privJwk.kty, crv: privJwk.crv, x: privJwk.x, y: privJwk.y };
                    } else {
                        throw new Error('公開鍵が取得できません');
                    }

                    const recipPubKey = await crypto.subtle.importKey("jwk", recipPubJwk, { name: "ECDH", namedCurve: "P-256" }, true, []);
                    const ephemKeyPair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
                    const ephemPubJwk = await crypto.subtle.exportKey("jwk", ephemKeyPair.publicKey);

                    const sharedKey = await crypto.subtle.deriveKey({ name: "ECDH", public: recipPubKey }, ephemKeyPair.privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const encryptedBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sharedKey, encoder.encode(JSON.stringify(cardData)));

                    payload = { mode: 'private', ephem_pub: bufToBase64(encoder.encode(JSON.stringify(ephemPubJwk))), iv: bufToBase64(iv), ciphertext: bufToBase64(encryptedBuf) };
                }

                if (globalWs && globalWs.readyState === WebSocket.OPEN) {
                    globalWs.send(JSON.stringify({
                        type: 'POST_CARD',
                        box_id: boxId,
                        payload: payload,
                        expires_at: Date.now() + (30 * 24 * 60 * 60 * 1000)
                    }));

                    alert(isPrivate ? '受け取る人しか見られないメッセージを送りました！' : 'メッセージを送信しました！');

                    $('#editor-body').text('');

                    closeModal();
                } else {
                    alert('サーバーとの通信が切断されています。再読み込みしてください。');
                }
            } catch (err) {
                console.error('送信エラー:', err);
                alert('送信に失敗しました。');
            } finally {
                $btn.prop('disabled', false).text('メッセージを追加');
            }
        }

        async function decryptAndRenderCard(card, position = 'append') {
            if (renderedCardIds.has(card.id)) return;
            renderedCardIds.add(card.id);

            const params = getParams();
            const boxKeyStr = params.boxKey;
            const privStr = params.priv;
            const payload = card.payload;

            if (!boxKeyStr) return;

            const boxCryptoKey = await crypto.subtle.importKey("raw", base64ToBuf(boxKeyStr), { name: "AES-GCM" }, false, ["decrypt"]);
            let recipPrivKey = null;
            if (privStr) {
                const recipPrivJwk = JSON.parse(decoder.decode(base64ToBuf(privStr)));
                recipPrivKey = await crypto.subtle.importKey("jwk", recipPrivJwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
            }

            if (payload.mode === 'public') {
                try {
                    const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: base64ToBuf(payload.iv) }, boxCryptoKey, base64ToBuf(payload.ciphertext));
                    renderCard(JSON.parse(decoder.decode(buf)), false, position);
                } catch (e) { console.error("全体復号失敗", e); }
            } else if (payload.mode === 'private') {
                if (recipPrivKey) {
                    try {
                        const ephemPubJwk = JSON.parse(decoder.decode(base64ToBuf(payload.ephem_pub)));
                        const ephemPubKey = await crypto.subtle.importKey("jwk", ephemPubJwk, { name: "ECDH", namedCurve: "P-256" }, true, []);
                        const sharedKey = await crypto.subtle.deriveKey({ name: "ECDH", public: ephemPubKey }, recipPrivKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
                        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: base64ToBuf(payload.iv) }, sharedKey, base64ToBuf(payload.ciphertext));
                        renderCard(JSON.parse(decoder.decode(buf)), true, position);
                    } catch (e) { console.error("プライベート復号失敗", e); }
                } else {
                    renderLockedCard(position);
                }
            }
        }

        function renderCard(card, isPrivate, position = 'append') {
            const iconUrl = isSafeImageUrl(card.sender_icon) ? card.sender_icon : 'assets/defaulticon.png';
            const iconHtml = `<img src="${escapeHtml(iconUrl)}" class="sender-icon" alt="icon">`;

            const textColor = card.theme_color || '#ffffff';

            const $cardEl = $('<div>')
                .addClass('square-card')
                .css('color', textColor);

            if (isSafeImageUrl(card.bg_image)) {
                $cardEl.css('backgroundImage', `url(${card.bg_image})`);
            }

            const rawText = card.text || card.text_html || '';
            const safeText = escapeHtml(rawText).replace(/\r?\n/g, '<br>');
            const safeName = escapeHtml(card.sender_name || '匿名');

            $cardEl.html(`
                <div class="card-content">
                  <div class="card-header">
                    ${iconHtml}
                    <div>
                      <div class="header-title">${safeName}</div>
                      ${isPrivate ? '<span class="badge-private">あなたのみ閲覧可</span>' : ''}
                    </div>
                  </div>
                  <div class="card-body" style="color: ${textColor}">${safeText}</div>
                  <div style="font-size: 12px; text-align: right;">
                    ${new Date(card.created_at).toLocaleString()}
                  </div>
                </div>
            `);

            if (position === 'prepend') {
                $('#cards-container').prepend($cardEl);
            } else {
                $('#cards-container').append($cardEl);
            }
        }

        function renderLockedCard(position = 'append') {
            const $cardEl = $('<div>')
                .addClass('square-card')
                .css('background', '#4a4747')
                .css('color', '#ffffff')
                .html(`
                  <div class="card-content" style="justify-content: center; align-items: center; text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 10px;">🔒</div>
                    <div style="font-weight: bold; font-size: 20px">受け取る人限定メッセージ</div>
                    <div style="font-size: 16px; opacity: 0.8; margin-top: 6px;">このカードは受け取る人のみが復号して閲覧できます。</div>
                  </div>
                `);

            if (position === 'prepend') {
                $('#cards-container').prepend($cardEl);
            } else {
                $('#cards-container').append($cardEl);
            }
        }

        function toggleModal() {
            const $modal = $('#section-form');

            if ($modal.hasClass('open')) {
                closeModal();
            } else {
                openModal();
            }
        }

        function openModal() {
            $('#section-form').addClass('open');
            $('#modal-overlay').show().addClass('open');
        }

        function closeModal() {
            $('#section-form').removeClass('open');
            $('#modal-overlay').removeClass('open');
            setTimeout(() => {
                if (!$('#modal-overlay').hasClass('open')) {
                    $('#modal-overlay').hide();
                }
            }, 300);
        }

        $(document).on('click', '.url-box', async function () {
            const urlText = $(this).text().trim();
            if (!urlText) return;

            try {
                await navigator.clipboard.writeText(urlText);
                alert('URLをコピーしました！');
            } catch (err) {
                console.error('コピーに失敗しました:', err);
            }
        });

        function parseHashAndSetup() {
            const params = getParams();

            if (params.box) {
                $('#section-create').hide();
                $('#section-box').show();

                if (params.priv) {
                    $('#section-form').hide();
                    $('#box-title').remove();
                } else {
                    $('#section-form').show();
                }

                $('#half-modal-header').off('click').on('click', function () {
                    toggleModal();
                });

                $('#modal-overlay').off('click').on('click', function () {
                    closeModal();
                });

                initWebSocketConnection();
            }
        }
    </script>
</body>

</html>
